<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 体检合规 - 企业合规风险评估</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-screen {
            display: none;
        }

        .email-screen {
            display: none;
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .risk-level {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        .risk-low { color: #4CAF50; }
        .risk-medium { color: #FF9800; }
        .risk-high { color: #F44336; }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none !important;
        }

        /* Add your existing CSS here... */
    </style>
</head>
<body>
    <div class="container">
        <!-- Introduction Screen -->
        <div id="intro-screen">
            <div class="header">
                <h1>AI 体检合规</h1>
                <p>企业合规风险评估工具</p>
            </div>
            <p style="text-align: center; margin-bottom: 30px;">
                通过30道专业题目，快速评估您的AI使用、数据合规、广告合规风险等级
            </p>
            <button id="start-btn" class="btn">开始测评</button>
        </div>

        <!-- Question Screens will be generated by JavaScript -->

        <!-- Email Input Screen -->
        <div id="email-screen" class="hidden">
            <div class="header">
                <h1>输入邮箱</h1>
                <p>接收您的专业PDF报告</p>
            </div>
            <input type="email" id="email-input" placeholder="请输入您的邮箱地址" 
                   style="width: 100%; padding: 12px; margin: 20px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px;">
            <button id="submit-btn" class="btn">生成报告</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden">
            <div class="header">
                <h1>测评完成！</h1>
                <p>您的合规风险评估结果</p>
            </div>
            <div style="font-size: 20px; margin: 20px 0;">
                综合得分: <span id="final-score">0分</span>
            </div>
            <div class="risk-level" id="risk-level">🟢 低风险</div>
            <p style="margin: 20px 0;">
                专业PDF报告已发送至您的邮箱，请注意查收！
            </p>
            <p style="margin: 20px 0; color: #666;">
                如未收到邮件，请检查垃圾邮件文件夹，或联系微信：boen-data
            </p>
            <button onclick="location.reload()" class="btn">重新测评</button>
        </div>
    </div>

    <script>
        // Your existing JavaScript logic here...
        // The key change is in the API call below
        
        // Modified API call to use Vercel endpoint
        async function submitAnswers(answers, userEmail) {
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = '生成报告中...';
            submitBtn.disabled = true;
            
            // Use Vercel API endpoint instead of relative path
            const vercelUrl = 'https://ai-compliance-checker-api.vercel.app/api/submit';
            
            try {
                const response = await fetch(vercelUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        answers: answers,
                        email: userEmail
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Display results
                    document.getElementById('email-screen').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                    document.getElementById('final-score').textContent = result.score + '分 (' + result.percentage + '%)';
                    
                    let riskText = result.riskLevel;
                    let riskClass = '';
                    if (result.percentage >= 80) {
                        riskText = '🟢 低风险';
                        riskClass = 'risk-low';
                    } else if (result.percentage >= 60) {
                        riskText = '🟡 中风险';
                        riskClass = 'risk-medium';
                    } else {
                        riskText = '🔴 高风险';
                        riskClass = 'risk-high';
                    }
                    
                    document.getElementById('risk-level').textContent = riskText;
                    document.getElementById('risk-level').className = 'risk-level ' + riskClass;
                } else {
                    alert('提交失败：' + result.message);
                    submitBtn.textContent = '生成报告';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('网络错误，请稍后重试');
                submitBtn.textContent = '生成报告';
                submitBtn.disabled = false;
            }
        }
        
        // Rest of your JavaScript code...
        document.getElementById('start-btn').addEventListener('click', function() {
            document.getElementById('intro-screen').classList.add('hidden');
            // Show first question screen (you'll need to implement this)
            // For now, just show email screen for testing
            document.getElementById('email-screen').classList.remove('hidden');
        });
    </script>
</body>
</html>
